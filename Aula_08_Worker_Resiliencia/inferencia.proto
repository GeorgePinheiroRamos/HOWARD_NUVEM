syntax = "proto3";

package inferencia;

service Inferencia {
  rpc Prever (PedidoPrever) returns (RespostaPrever);
  rpc PreverLote (PedidoLote) returns (RespostaLote);
}

message PedidoPrever { string texto = 1; }
message RespostaPrever {
  string texto = 1;
  string sentimento = 2;
  double confianca = 3;
}
message PedidoLote { repeated string textos = 1; }
message RespostaLote { repeated RespostaPrever resultados = 1; }
